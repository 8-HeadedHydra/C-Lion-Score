<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C+Lions Score Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="score-container">
        
        <!-- RadLions Column -->
        <div class="team">
            <div id="RadLionScore">RadLions: 0</div>
            <div class="btn-group">
                <button id="RadLion">+</button>
                <button id="RadLionMinus" class="minus-btn">-</button>
            </div>
        </div>

        <!-- ElectroLions Column -->
        <div class="team">
            <div id="ElectroLionScore">ElectroLions: 0</div>
            <div class="btn-group">
                <button id="ElectroLion">+</button>
                <button id="ElectroLionMinus" class="minus-btn">-</button>
            </div>
        </div>

        <!-- MechaLions Column -->
        <div class="team">
            <div id="MechaLionScore">MechaLions: 0</div>
            <div class="btn-group">
                <button id="MechaLion">+</button>
                <button id="MechaLionMinus" class="minus-btn">-</button>
            </div>
        </div>

    </div>

    <button id="ResetBtn">Reset All Scores</button>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
